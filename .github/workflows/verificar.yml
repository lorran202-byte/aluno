name: Verificar Firebase
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Teste de ponta a ponta (conta temporária, apagada no fim)
        run: |
          set +e
          P=la-consultoria-67f79
          K=AIzaSyDhXUUUVSTZnUGa8n5hhYVzb9WExbZD1Ao
          B="https://firestore.googleapis.com/v1/projects/$P/databases/(default)/documents"
          J='Content-Type: application/json'
          T="teste$(date +%s)"
          {
            conta() { curl -s -X POST -H "$J" -d "{\"email\":\"$1\",\"password\":\"senha-teste-123\",\"returnSecureToken\":true}" "https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=$K"; }
            echo "== 1 criar contas temporárias (personal e aluno)"
            R=$(conta "$T@teste-la.com"); ID=$(echo "$R" | jq -r .idToken); UID_=$(echo "$R" | jq -r .localId)
            R2=$(conta "$T@alunos.laconsultoria.app"); IDA=$(echo "$R2" | jq -r .idToken); UIDA=$(echo "$R2" | jq -r .localId)
            echo "personal: $([ "$UID_" != null ] && echo ok || echo NAO) | aluno: $([ "$UIDA" != null ] && echo ok || echo NAO)"
            echo "== 2 backup do dono (esperado 200)"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -X PATCH -H "$J" -H "Authorization: Bearer $ID" -d '{"fields":{"d":{"stringValue":"x"}}}' "$B/personal/$UID_/backup/p0?key=$K"
            echo "== 3 backup de outro uid (esperado 403)"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -X PATCH -H "$J" -H "Authorization: Bearer $ID" -d '{"fields":{"d":{"stringValue":"x"}}}' "$B/personal/outro/backup/p0?key=$K"
            echo "== 4 publicar treino ligado ao aluno (esperado 200)"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -X POST -H "X-HTTP-Method-Override: PATCH" -H "$J" -H "Authorization: Bearer $ID" -d "{\"fields\":{\"dono\":{\"stringValue\":\"$UID_\"},\"aluno\":{\"stringValue\":\"$UIDA\"},\"dados\":{\"stringValue\":\"{}\"}}}" "$B/publico/$T?key=$K"
            echo "== 5 gravar acesso do aluno (esperado 200)"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -X POST -H "X-HTTP-Method-Override: PATCH" -H "$J" -H "Authorization: Bearer $ID" -d "{\"fields\":{\"dono\":{\"stringValue\":\"$UID_\"},\"token\":{\"stringValue\":\"$T\"}}}" "$B/acesso/$UIDA?key=$K"
            echo "== 6 aluno logado lê o acesso e o treino (esperado 200 200)"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $IDA" "$B/acesso/$UIDA?key=$K"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $IDA" "$B/publico/$T?key=$K"
            echo "== 7 sem login lê o treino (esperado 403)"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" "$B/publico/$T?key=$K"
            echo "== 8 aluno logado registra série (esperado 200)"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -X POST -H "$J" -H "Authorization: Bearer $IDA" -d '{"fields":{"dados":{"stringValue":"{\"series\":[]}"},"criadoEm":{"stringValue":"1"}}}' "$B/publico/$T/registros?key=$K"
            echo "== 9 sem login registra série (esperado 403)"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -X POST -H "$J" -d '{"fields":{"dados":{"stringValue":"{\"series\":[]}"},"criadoEm":{"stringValue":"1"}}}' "$B/publico/$T/registros?key=$K"
            echo "== 10 aluno tenta alterar treino (esperado 403)"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -X PATCH -H "$J" -H "Authorization: Bearer $IDA" -d '{"fields":{"dono":{"stringValue":"hacker"}}}' "$B/publico/$T?key=$K"
            echo "== 10b aluno grava o aparelho e o personal lê (esperado 200 200)"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -X PATCH -H "$J" -H "Authorization: Bearer $IDA" -d '{"fields":{"senha":{"stringValue":"x"}}}' "$B/acesso/$UIDA/aparelho/chave?key=$K"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" -H "Authorization: Bearer $ID" "$B/acesso/$UIDA/aparelho/chave?key=$K"
            echo "== 10c sem login lê o aparelho (esperado 403)"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" "$B/acesso/$UIDA/aparelho/chave?key=$K"
            curl -s -o /dev/null -w "limpa aparelho %{http_code}\n" -X DELETE -H "Authorization: Bearer $ID" "$B/acesso/$UIDA/aparelho/chave?key=$K"
            echo "== 11 dono lista registros (esperado 1)"
            L=$(curl -s -H "Authorization: Bearer $ID" "$B/publico/$T/registros?key=$K"); echo "$L" | jq '.documents | length'
            echo "== 12 limpeza"
            for d in $(echo "$L" | jq -r '.documents[].name'); do curl -s -o /dev/null -w "reg %{http_code}\n" -X DELETE -H "Authorization: Bearer $ID" "https://firestore.googleapis.com/v1/$d?key=$K"; done
            curl -s -o /dev/null -w "treino %{http_code}\n" -X DELETE -H "Authorization: Bearer $ID" "$B/publico/$T?key=$K"
            curl -s -o /dev/null -w "acesso %{http_code}\n" -X DELETE -H "Authorization: Bearer $ID" "$B/acesso/$UIDA?key=$K"
            curl -s -o /dev/null -w "backup %{http_code}\n" -X DELETE -H "Authorization: Bearer $ID" "$B/personal/$UID_/backup/p0?key=$K"
            curl -s -o /dev/null -w "conta aluno %{http_code}\n" -X POST -H "$J" -d "{\"idToken\":\"$IDA\"}" "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$K"
            curl -s -o /dev/null -w "conta personal %{http_code}\n" -X POST -H "$J" -d "{\"idToken\":\"$ID\"}" "https://identitytoolkit.googleapis.com/v1/accounts:delete?key=$K"
            echo "== 13 página"
            curl -s -o /dev/null -w "HTTP %{http_code}\n" "https://laconsultoria.pages.dev/"
          } > resultado.txt 2>&1
          cat resultado.txt
      - name: Publicar resultado
        run: |
          git config user.name "verificador"; git config user.email "verificador@users.noreply.github.com"
          cp resultado.txt /tmp/resultado.txt
          git checkout --orphan verificacao
          git rm -rfq --cached .
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp /tmp/resultado.txt .
          git add resultado.txt; git commit -qm "verificação $(date -u +%FT%TZ)"
          git push -f origin verificacao
